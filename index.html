<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Nộp Bài Tập Tin Học</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
  <div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-md flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold">CỔNG NỘP BÀI TẬP TIN HỌC</h1>
        <p class="text-blue-100 text-sm">Học sinh nộp bài - Tự động lưu thẳng vào Google Drive của Thầy/Cô</p>
      </div>
      <button onclick="toggleMode()" id="modeBtn" class="bg-white text-blue-600 px-4 py-2 rounded-xl font-semibold shadow hover:bg-blue-50">
        Góc Giáo Viên
      </button>
    </div>

    <!-- GIAO DIỆN HỌC SINH -->
    <div id="studentView" class="bg-white p-6 rounded-2xl shadow-sm">
      <h2 class="text-xl font-bold text-slate-800 mb-4">Nộp bài tập thực hành</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">1. Chọn Lớp</label>
          <select id="stuClass" onchange="renderStudentList()" class="w-full border rounded-xl p-3 bg-slate-50 font-medium"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">2. Chọn Tên của em</label>
          <select id="stuName" class="w-full border rounded-xl p-3 bg-slate-50 font-medium"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">3. Chọn Thư mục Tuần</label>
          <select id="stuWeek" class="w-full border rounded-xl p-3 bg-slate-50 font-medium"></select>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1">4. Chọn tệp bài làm (Word, PowerPoint, Scratch, Hình ảnh...)</label>
        <input type="file" id="stuFile" class="w-full border-2 border-dashed border-blue-300 rounded-xl p-4 bg-blue-50/50">
      </div>

      <button onclick="submitHomework()" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-lg shadow transition">
        NỘP BÀI LÊN GOOGLE DRIVE
      </button>
      <p id="statusMsg" class="mt-3 text-center font-medium"></p>
    </div>

    <!-- GIAO DIỆN GIÁO VIÊN -->
    <div id="teacherView" class="hidden space-y-6">
      <!-- Tạo tuần mới -->
      <div class="bg-white p-6 rounded-2xl shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-3">Tạo thư mục tuần mới (Tự động tạo trên Google Drive)</h2>
        <div class="flex gap-3">
          <input type="text" id="newWeekInput" placeholder="VD: TUAN 01" class="flex-1 border rounded-xl p-3 font-medium">
          <button onclick="createNewWeek()" id="createWeekBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700">
            + Tạo Thư Mục
          </button>
        </div>
      </div>

      <!-- Thống kê nộp bài -->
      <div class="bg-white p-6 rounded-2xl shadow-sm">
        <div class="flex flex-wrap gap-4 justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800">Thống kê tình hình nộp bài</h2>
          <div class="flex gap-2">
            <select id="statClass" onchange="renderStats()" class="border rounded-lg p-2 font-medium"></select>
            <select id="statWeek" onchange="renderStats()" class="border rounded-lg p-2 font-medium"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="border border-red-200 bg-red-50/50 rounded-xl p-4">
            <h3 class="font-bold text-red-700 mb-2">Chưa nộp bài (<span id="missingCount">0</span>)</h3>
            <ul id="missingList" class="space-y-1 text-red-800 text-sm"></ul>
          </div>
          <div class="border border-green-200 bg-green-50/50 rounded-xl p-4">
            <h3 class="font-bold text-green-700 mb-2">Đã nộp bài (<span id="doneCount">0</span>)</h3>
            <ul id="doneList" class="space-y-2 text-green-800 text-sm"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ HÃY DÁN LINK APPS SCRIPT CỦA THẦY VÀO ĐÂY:
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqPTLokqtpXqWezJp95fNKljI-YVsnqFOHVNXLVV_WewfvDO4ZJk2I0azFlvDXMdPQNg/exec';

    let appData = { classes: {}, weeks: [], submissions: [] };
    let isTeacher = false;

    async function fetchData() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        appData = await res.json();
        populateSelects();
      } catch (err) {
        console.error("Lỗi tải dữ liệu:", err);
      }
    }

    function toggleMode() {
      if (!isTeacher) {
        const pass = prompt("Nhập mật khẩu Giáo viên (mặc định: 1234):");
        if (pass !== "admin") return alert("Sai mật khẩu!");
      }
      isTeacher = !isTeacher;
      document.getElementById('studentView').classList.toggle('hidden', isTeacher);
      document.getElementById('teacherView').classList.toggle('hidden', !isTeacher);
      document.getElementById('modeBtn').innerText = isTeacher ? "Về Trang Học Sinh" : "Góc Giáo Viên";
      if (isTeacher) renderStats();
    }

    function populateSelects() {
      const classNames = Object.keys(appData.classes);
      const stuClass = document.getElementById('stuClass');
      const statClass = document.getElementById('statClass');
      stuClass.innerHTML = statClass.innerHTML = classNames.map(c => `<option value="${c}">${c}</option>`).join('');

      const weekOptions = appData.weeks.map(w => `<option value="${w}">${w}</option>`).join('');
      document.getElementById('stuWeek').innerHTML = weekOptions || '<option value="">Chưa có tuần nào</option>';
      document.getElementById('statWeek').innerHTML = weekOptions;

      renderStudentList();
      renderStats();
    }

    function renderStudentList() {
      const cls = document.getElementById('stuClass').value;
      const students = appData.classes[cls] || [];
      document.getElementById('stuName').innerHTML = students.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    async function createNewWeek() {
      const weekName = document.getElementById('newWeekInput').value.trim();
      if (!weekName) return alert("Thầy/Cô hãy nhập tên tuần (VD: TUAN 01)");
      
      const btn = document.getElementById('createWeekBtn');
      btn.disabled = true;
      btn.innerText = "Đang tạo trên Drive...";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addWeek', weekName })
        });
        document.getElementById('newWeekInput').value = "";
        alert(`Đã tạo thành công thư mục "${weekName}" trên Google Drive!`);
        await fetchData();
      } catch (e) {
        alert("Lỗi khi tạo tuần: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "+ Tạo Thư Mục";
      }
    }

    async function submitHomework() {
      const weekName = document.getElementById('stuWeek').value;
      const className = document.getElementById('stuClass').value;
      const studentName = document.getElementById('stuName').value;
      const fileInput = document.getElementById('stuFile');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      if (!weekName || !fileInput.files[0]) return alert("Em hãy chọn Thư mục Tuần và chọn Tệp bài làm nhé!");

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = "Đang tải bài lên Google Drive...";
      statusMsg.innerText = "";

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async function () {
        const base64Data = reader.result.split(',')[1];
        const payload = {
          className,
          studentName,
          weekName,
          fileName: file.name,
          mimeType: file.type || 'application/octet-stream',
          fileData: base64Data
        };

        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.status === 'success') {
            statusMsg.className = "mt-3 text-center font-bold text-green-600";
            statusMsg.innerText = `Nộp bài thành công! Thầy/Cô đã nhận được tệp của em.`;
            fileInput.value = "";
            await fetchData();
          } else {
            throw new Error(result.message);
          }
        } catch (e) {
          statusMsg.className = "mt-3 text-center font-bold text-red-600";
          statusMsg.innerText = "Lỗi: " + e.message;
        } finally {
          btn.disabled = false;
          btn.innerText = "NỘP BÀI LÊN GOOGLE DRIVE";
        }
      };
    }

    function renderStats() {
      const cls = document.getElementById('statClass').value;
      const selectedWeek = document.getElementById('statWeek').value;
      const students = appData.classes[cls] || [];
      
      const subs = appData.submissions.filter(s => s.className === cls && s.week === selectedWeek);
      const doneNames = subs.map(s => s.studentName);
      const missing = students.filter(s => !doneNames.includes(s));

      document.getElementById('missingCount').innerText = missing.length;
      document.getElementById('missingList').innerHTML = missing.map(s => `<li>• ${s}</li>`).join('') || '<li>Tất cả học sinh lớp này đã nộp đủ!</li>';

      document.getElementById('doneCount').innerText = subs.length;
      document.getElementById('doneList').innerHTML = subs.map(s =>
        `<li class="flex justify-between items-center bg-white p-2 rounded border">
          <span>✔ <b>${s.studentName}</b> <span class="text-xs text-slate-500">(${s.time})</span></span>
          <a href="${s.link}" target="_blank" class="text-blue-600 underline font-medium">Mở Drive</a>
        </li>`
      ).join('');
    }

    fetchData();
  </script>
</body>
</html>
